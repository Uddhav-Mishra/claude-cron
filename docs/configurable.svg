<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect width="1200" height="700" fill="#0d1117"/>

  <!-- title -->
  <text x="60" y="68" fill="#e6edf3" font-size="40" font-weight="700">Same repo. Your timezone. Your hours.</text>
  <text x="60" y="104" fill="#8b949e" font-size="20">Claude greets you on a schedule you choose — set two variables, done.</text>

  <!-- ===================== ROW 1: Mumbai ===================== -->
  <circle cx="70" cy="162" r="7" fill="#2dd4bf"/>
  <text x="88" y="170" fill="#e6edf3" font-size="26" font-weight="700">Mumbai · India</text>

  <rect x="60" y="186" width="640" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="78" y="212" fill="#c9d1d9" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TZ = Asia/Kolkata     RUN_HOURS = 6,11,16,21</text>

  <!-- timeline baseline -->
  <line x1="80" y1="300" x2="1140" y2="300" stroke="#30363d" stroke-width="2"/>
  <!-- axis ticks -->
  <g fill="#6e7681" font-size="14" text-anchor="middle">
    <text x="80"  y="330">12am</text>
    <text x="345" y="330">6am</text>
    <text x="610" y="330">12pm</text>
    <text x="875" y="330">6pm</text>
    <text x="1140" y="330">12am</text>
  </g>
  <!-- 5h windows -->
  <g fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-opacity="0.5">
    <rect x="345"  y="280" width="221" height="40" rx="4"/>
    <rect x="566"  y="280" width="221" height="40" rx="4"/>
    <rect x="787"  y="280" width="221" height="40" rx="4"/>
    <rect x="1007" y="280" width="133" height="40" rx="4"/>
  </g>
  <!-- markers -->
  <g stroke="#2dd4bf" stroke-width="3">
    <line x1="345"  y1="255" x2="345"  y2="320"/>
    <line x1="566"  y1="255" x2="566"  y2="320"/>
    <line x1="787"  y1="255" x2="787"  y2="320"/>
    <line x1="1007" y1="255" x2="1007" y2="320"/>
  </g>
  <g fill="#2dd4bf" font-size="14" text-anchor="middle" font-weight="600">
    <text x="345"  y="248">6:00</text>
    <text x="566"  y="248">11:00</text>
    <text x="787"  y="248">16:00</text>
    <text x="1007" y="248">21:00</text>
  </g>

  <!-- ===================== ROW 2: New York ===================== -->
  <circle cx="70" cy="412" r="7" fill="#a78bfa"/>
  <text x="88" y="420" fill="#e6edf3" font-size="26" font-weight="700">New York · USA</text>

  <rect x="60" y="436" width="640" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="78" y="462" fill="#c9d1d9" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TZ = America/New_York     RUN_HOURS = 9,18</text>

  <line x1="80" y1="550" x2="1140" y2="550" stroke="#30363d" stroke-width="2"/>
  <g fill="#6e7681" font-size="14" text-anchor="middle">
    <text x="80"  y="580">12am</text>
    <text x="345" y="580">6am</text>
    <text x="610" y="580">12pm</text>
    <text x="875" y="580">6pm</text>
    <text x="1140" y="580">12am</text>
  </g>
  <g fill="#a78bfa" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.5">
    <rect x="477" y="530" width="221" height="40" rx="4"/>
    <rect x="875" y="530" width="221" height="40" rx="4"/>
  </g>
  <g stroke="#a78bfa" stroke-width="3">
    <line x1="477" y1="505" x2="477" y2="570"/>
    <line x1="875" y1="505" x2="875" y2="570"/>
  </g>
  <g fill="#a78bfa" font-size="14" text-anchor="middle" font-weight="600">
    <text x="477" y="498">9:00</text>
    <text x="875" y="498">18:00</text>
  </g>

  <!-- legend / footer -->
  <text x="60" y="660" fill="#8b949e" font-size="18">Shaded = your 5-hour Claude window · markers = auto "hi" fired by GitHub Actions</text>
  <text x="1140" y="660" fill="#6e7681" font-size="16" text-anchor="end">github.com/Uddhav-Mishra/claude-cron</text>
</svg>
