name: claude-hi

on:
  schedule:
    # Runs every hour (UTC); the "Gate" step decides if the current hour matches
    # YOUR local schedule (repo Variables TZ + RUN_HOURS), so you don't edit this.
    # The cron MINUTE sets the run's local minute: local_minute =
    # (cron_minute + tz_offset_minutes) mod 60. Minute 30 + IST(+5:30) => :00 IST,
    # i.e. runs land exactly on the hour (11:00 / 16:00 IST).
    - cron: "30 * * * *"
    - cron: "40 12 * * *" # TEMP test: 12:40 UTC = 18:10 IST (remove after testing)
    - cron: "45 12 * * *" # TEMP test: 12:45 UTC = 18:15 IST (remove after testing)
  workflow_dispatch: {} # manual run for testing (always passes the gate)

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  hi:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on local time
        id: gate
        env:
          # Override these in: repo Settings -> Secrets and variables -> Actions -> Variables
          # Common TZ: America/New_York, America/Chicago, America/Los_Angeles,
          #   Europe/London, Europe/Paris, Asia/Kolkata, Asia/Tokyo, Australia/Sydney
          #   (full list + more in the README)
          TZ: ${{ vars.TZ || 'Asia/Kolkata' }}
          RUN_HOURS: ${{ vars.RUN_HOURS || '11,16' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run — skipping time gate."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ="$TZ" date +%-H)
          echo "Current hour in $TZ: $hour (configured RUN_HOURS: $RUN_HOURS)"
          if [[ ",$RUN_HOURS," == *",$hour,"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a scheduled hour — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code CLI
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.195

      - name: Send hi to Claude
        if: steps.gate.outputs.run == 'true'
        run: python3 send_hi.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
