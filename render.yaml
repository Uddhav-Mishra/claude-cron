services:
  - type: cron
    name: claude-hi-cron
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render cron schedules are in UTC. IST is UTC+5:30.
    #   05:30 UTC = 11:00 AM IST
    #   10:30 UTC =  4:00 PM IST
    schedule: "30 5,10 * * *"
    envVars:
      # Generate locally with `claude setup-token` (requires a Pro/Max subscription).
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
